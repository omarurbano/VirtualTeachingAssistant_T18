<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTA · Document Question & Answer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-5"/>
                    </svg>
                </div>
                <h1><span>VTA</span> Document Assistant</h1>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">ready</span>
                </div>
                <div class="status-item">
                    <span>v1.0</span>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <h2 class="welcome-title">Ask anything about your course</h2>
                <p class="welcome-subtitle">Upload your lecture notes and materials, then get grounded answers with citations you can verify.</p>

                <div class="welcome-actions">
                    <button class="action-btn" id="quickUpload">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Upload documents
                    </button>
                    <button class="action-btn" id="quickImageUpload" title="Upload image for vision analysis">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        Analyze image
                    </button>
                    <button class="action-btn" id="quickHelp">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        How it works
                    </button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages" style="display: none;">
                <div class="messages-container" id="messagesContainer"></div>
            </div>

            <!-- Loading -->
            <div class="loading-container" id="loadingIndicator">
                <div class="cursor-line">thinking</div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <!-- Files Bar -->
                <div class="files-bar" id="filesBar">
                    <span style="color: var(--text-faint); font-size: 12.5px; font-weight: 600;">Attached:</span>
                    <div id="filesList" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
                    <button class="files-clear" id="clearFilesBtn">Clear</button>
                </div>

                <!-- Images Bar -->
                <div class="files-bar" id="imagesBar" style="display: none;">
                    <span style="color: var(--text-faint); font-size: 12.5px; font-weight: 600;">Images:</span>
                    <div id="imagesList" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
                    <button class="files-clear" id="clearImagesBtn">Clear</button>
                </div>

                <!-- Command Line Input -->
                <div class="command-line">
                    <span class="prompt-symbol" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </span>
                    <div class="input-area">
                        <textarea
                            id="messageInput"
                            placeholder="Ask a question about your course materials..."
                            rows="1"
                            autocomplete="off"
                            spellcheck="false"
                        ></textarea>
                    </div>
                    <button class="attach-btn" id="attachBtn" title="Attach file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                </div>
                <p class="input-info">Responses are grounded in your uploaded documents only</p>
            </div>
        </div>

        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.txt,.rtf,.csv,.xlsx,.xls,.pptx,.mp3,.wav,.ogg,.m4a,.flac,.aac,.wma,.aiff,.opus,.webm,.amr,.3gp,.midi,.mid,.mp4,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tiff,.tif,.svg,.heic,.heif,.avif,image/*,audio/*" multiple>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
